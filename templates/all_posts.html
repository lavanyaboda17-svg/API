{% extends "base.html" %}

{% block content %}

<h1>All Posts</h1>

{% for post in posts %}
    <p><strong>Title:</strong> {{ post.title }}</p>
    <a href="/posts/{{ post.id }}">Read More</a>
    <hr>
{% endfor %}

<br>
{% if page > 1 %}
    <a href="/all?page={{ page - 1 }}">Previous</a>
{% endif %}

{% for p in range(1, total_pages + 1) %}
    <a href="/all?page={{ p }}">{{ p }}</a>
{% endfor %}

{% if page < total_pages %}
    <a href="/all?page={{ page + 1 }}">Next</a>
{% endif %}

{% endblock %}
