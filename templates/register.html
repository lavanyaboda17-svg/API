<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <title>Register</title>
  </head>

  <body class="d-flex flex-column min-vh-100">
     {% include 'header.html' %}
    <div class="container-fluid py-5 flex-grow-1" style="background: #eef2f7">
      <div class="row justify-content-center">
        <div class="col-md-4" style="margin-top: 80px">
          <form action="/register" method="POST">
            <div class="card">
              <div class="card-body">
                {% if error %}
                <div class="alert alert-dark" role="alert">
                      {{ error }}
                      </div>
                {% endif %}
                <div class="form-group">
                  <label for="username">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ request.form.get('username', '') }}"
                  />
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Password"
                  />
                </div>
                <button type="submit" class="btn btn-dark">Register</button>

                <p class="mt-3">
                  Already have an account?
                  <a href="{{ url_for('login') }}">Login here</a>
                </p>
                <div class="text-center mt-3">
                  <a href="https://google.com" class="text-dark mx-2">
                    <i class="bi bi-google" style="font-size: 1.5rem"></i>
                  </a>
                  <a href="https://instagram.com" class="text-dark mx-2">
                    <i class="bi bi-instagram" style="font-size: 1.5rem"></i>
                  </a>
                  <a href="https://facebook.com" class="text-dark mx-2">
                    <i class="bi bi-facebook" style="font-size: 1.5rem"></i>
                  </a>
                  <a href="https://whatsapp.com" class="text-dark mx-2">
                    <i class="bi bi-whatsapp" style="font-size: 1.5rem"></i>
                  </a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Footer -->
        {% include 'footer.html' %}
  </body>
</html>
