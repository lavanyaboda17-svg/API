<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap 4.4.1 CSS from CDN with SRI hash for integrity verification -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons for the social icons at the bottom -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <title>Register</title>
  </head>

  <body class="min-vh-100" style="background-color: #eef2f7">
    <div class="container-fluid py-5 flex-grow-1" style="background: #eef2f7">
      <div class="row justify-content-center">
        <!-- Centered column, ~1/3 width on medium+ screens -->
        <div class="col-md-4" style="margin-top: 80px">
          <!-- Registration form: submits username/password via POST to /register.
               NOTE: no CSRF token field, and no client-side password confirmation
               or strength validation present -->
          <form action="/register" method="POST">
            <div class="card">
              <div class="card-body">
                <!-- Jinja2: renders server-side error, e.g. "Username already taken" -->
                {% if error %}
                <div class="alert alert-dark" role="alert">
                      {{ error }}
                      </div>
                {% endif %}
                <div class="form-group">
                  <label for="username">Username</label>
                  <!-- Repopulates username after a failed submission using Flask's
                       request.form; password is intentionally left blank on reload -->
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ request.form.get('username', '') }}"
                  />
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <!-- type="password" masks input; no minlength/pattern enforced here,
                       so validation presumably happens server-side -->
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Password"
                  />
                </div>
                <button type="submit" class="btn btn-dark">Register</button>

                <p class="mt-3">
                  Already have an account?
                  <!-- Flask url_for() builds the link to the 'login' route dynamically -->
                  <a href="{{ url_for('login') }}">Login here</a>
                </p>
                <div class="text-center mt-3">
                  <!-- Social/external links — point to platform homepages only,
                       not real OAuth sign-up flows -->
                  <a href="https://google.com" class="text-dark mx-2">
                    <i class="bi bi-google" style="font-size: 1.5rem"></i>
                  </a>
                  <a href="https://instagram.com" class="text-dark mx-2">
                    <i class="bi bi-instagram" style="font-size: 1.5rem"></i>
                  </a>
                  <a href="https://facebook.com" class="text-dark mx-2">
                    <i class="bi bi-facebook" style="font-size: 1.5rem"></i>
                  </a>
                  <a href="https://whatsapp.com" class="text-dark mx-2">
                    <i class="bi bi-whatsapp" style="font-size: 1.5rem"></i>
                  </a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- jQuery slim build, required dependency for Bootstrap 4's JS plugins -->
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <!-- Popper.js: positions Bootstrap dropdowns/tooltips/popovers -->
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <!-- Bootstrap 4 JS bundle (needs jQuery + Popper loaded first) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
