<!doctype html>
<html lang="en">

<head>
  {% include 'head.html' %}
  <title>Reset Password</title>
</head>

<body class="d-flex flex-column min-vh-100">
  {% include 'header.html' %}

  <div class="container-fluid py-5 flex-grow-1" style="background: #eef2f7">
    <div class="row justify-content-center">
      <div class="col-md-4" style="margin-top: 80px">
        <form action="{{ url_for('reset_password', token=token) }}" method="POST">
          <div class="card">
            <div class="card-body">
              {% if error %}
              <div class="alert alert-dark" role="alert">{{ error }}</div>
              {% endif %}

              <h5 class="mb-3">Set New Password</h5>
              <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password" required />
              </div>
              <button type="submit" class="btn btn-dark">Update Password</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  {% include 'footer.html' %}
</body>

</html>
