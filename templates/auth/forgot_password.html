<!doctype html>
<html lang="en">

<head>
  {% include 'head.html' %}
  <title>Forgot Password</title>
</head>

<body class="d-flex flex-column min-vh-100">
  {% include 'header.html' %}

  <div class="container-fluid py-5 flex-grow-1" style="background: #eef2f7">
    <div class="row justify-content-center">
      <div class="col-md-4" style="margin-top: 80px">
        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
          <div class="card">
            <div class="card-body">
              {% if error %}
              <div class="alert alert-dark" role="alert">{{ error }}</div>
              {% endif %}
              {% if message %}
              <div class="alert alert-success" role="alert">{{ message }}</div>
              {% endif %}

              <h5 class="mb-3">Forgot Password</h5>
              <div class="form-group">
                <label for="email">Registered Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required />
              </div>
              <button type="submit" class="btn btn-dark">Send Reset Link</button>

              <p class="mt-3">
                Remembered your password?
                <a href="{{ url_for('auth.login') }}">Login here</a>
              </p>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  {% include 'footer.html' %}
</body>

</html>
