<!doctype html>
<html lang="en">

<head>
  {% include 'head.html' %}
  <title>Login</title>
</head>

<body class="d-flex flex-column min-vh-100">
  {% include 'header.html' %}
  <div class="container-fluid py-5 flex-grow-1" style="background: #eef2f7">
    <div class="row justify-content-center">
      <div class="col-md-4" style="margin-top: 80px">
        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="card">
            <div class="card-body">
              {% if error %}
              <div class="alert alert-dark" role="alert">
                {{error}}
              </div>
              {% endif %}

              <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                  placeholder="Enter username" value="{{ request.form.get('username', '') }}" />
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                  placeholder="Password" />
              </div>
              <button type="submit" class="btn btn-dark">Log in</button>

              <p class="mt-3">
                New user?
                <a href="{{ url_for('auth.register') }}">Register here</a>
              </p>
              <p>
                <a href="{{ url_for('auth.forgot_password') }}">Forgot Password?</a>
              </p>
              <div class="text-center mt-3">
                <a href="https://google.com" class="text-dark mx-2"><i class="bi bi-google"
                    style="font-size: 1.5rem"></i></a>
                <a href="https://instagram.com" class="text-dark mx-2"><i class="bi bi-instagram"
                    style="font-size: 1.5rem"></i></a>
                <a href="https://facebook.com" class="text-dark mx-2"><i class="bi bi-facebook"
                    style="font-size: 1.5rem"></i></a>
                <a href="https://whatsapp.com" class="text-dark mx-2"><i class="bi bi-whatsapp"
                    style="font-size: 1.5rem"></i></a>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- Footer -->
  {% include 'footer.html' %}
</body>

</html>
