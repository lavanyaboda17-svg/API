<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes page fit on mobile screens -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Bootstrap CSS (design library) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous" />
  <title>Create Post</title>
</head>

<!-- Background image covering full page -->
<body class="d-flex flex-column min-vh-100" style="background-image: url('img/pexels-shotbyrain-4705118.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">

  <!-- Top navigation bar (same as other pages) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand font-weight-bold" href="{{ url_for('index') }}">BlogApp</a>
    <!-- Hamburger button - only on mobile -->
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('index') }}">HOME</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('about') }}">ABOUT US</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('post_page') }}">CREATE POST</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('get_user_posts', user_id=session['user_id']) }}">VIEW POSTS</a>
        </li>
      </ul>
      <!-- Show logged in username -->
      <span class="navbar-text text-white mr-3">
        <i><b><marquee scrollamount="3">Welcome, {{ username }}❤️🤗</marquee></b></i>
      </span>
      <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </nav>

  <!-- Show error message if Flask sends one -->
  {% if error %}
  <div class="alert alert-dark" role="alert">{{ error }}</div>
  {% endif %}

  <!-- Form submits to /create-post route in Flask using POST method -->
  <form action="/create-post" method="POST" class="flex-grow-1">
    <div class="container mt-5">

      <!-- Post title input -->
      <div class="form-group">
        <label for="posttitle">Post Title</label>
        <input type="text" class="form-control" id="posttitle" name="title" placeholder="Enter post title" />
      </div>

      <!-- Post content - textarea (multiline input) -->
      <div class="form-group">
        <label for="postcontent">Post Content</label>
        <textarea class="form-control" id="postcontent" name="body" rows="5" placeholder="Enter post content"></textarea>
      </div>

      <!-- Submit button - sends post data to Flask -->
      <button type="submit" class="btn btn-dark">Submit</button>

    </div>
  </form>

  <!-- Footer at bottom -->
  <footer class="bg-secondary text-white text-center" style="height: 50px; line-height: 50px">
    <small>&copy; 2025 BlogApp. Made with Flask &amp; Bootstrap.</small>
  </footer>

  <!-- Bootstrap JS files (needed for navbar toggle) -->
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>
</html>
