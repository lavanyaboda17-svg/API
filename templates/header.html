<!-- Navbar -->
    <!-- Top navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <!-- Site logo/name - clicks go to home -->
      <a class="navbar-brand font-weight-bold" href="{{ url_for('index') }}"
        >BlogApp</a
      >
      <!-- Hamburger button - only visible on mobile -->
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- All nav links inside this collapsible box -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" href="{{ url_for('index') }}">HOME</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('about') }}">ABOUT US</a>
          </li>
          <!-- Show these links only if user is logged in -->
          {% if session.get('user_id') %}
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('post_page') }}"
              >CREATE POST</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="{{ url_for('get_user_posts', user_id=session['user_id']) }}"
              >VIEW POSTS</a
            >
          </li>
          {% endif %}
        </ul>

        <!-- If logged in: show username + logout, else show login/register -->
        {% if session.get('user_id') %}
        <span class="navbar-text text-white mr-3">
          <i
            ><b><marquee>Welcome, {{ username }}❤️🤗</marquee></b></i
          >
        </span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm"
          >Logout</a
        >
        {% else %}
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">LOGIN</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('register') }}">REGISTER</a>
          </li>
        </ul>
        {% endif %}
      </div>
    </nav>
