<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Makes page fit on mobile screens -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <!-- CDN (Content Delivery Network) -->
    <title>BlogApp - For Everyone</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    {% include 'header.html' %}
    <!-- Background video section -->
    <div class="position-relative overflow-hidden flex-grow-1">
      <!-- Autoplay video, muted (required for autoplay), loops forever -->
      <video
        autoplay
        muted
        loop
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        "
      >
        <!-- Video file from static folder -->
        <source
          src="{{ url_for('static', filename='abc.mp4') }}"
          type="video/mp4"
        />
      </video>
      <!-- Dark overlay on video + centered text -->
      <div
        class="position-absolute w-100 h-100 d-flex align-items-center justify-content-center flex-column"
        style="top: 0; background: rgba(0, 0, 0, 0.55)"
      >
        <h1 class="text-white font-weight-bold">Welcome To BlogApp</h1>
        <p class="text-white-50">
          Read, write, and share your thoughts with the world.
        </p>
        <a href="{{ url_for('register') }}" class="btn btn-dark btn-lg mt-3"
          >Get Started</a
        >
      </div>
    </div>

    {% include 'footer.html' %}
  </body>
</html>
