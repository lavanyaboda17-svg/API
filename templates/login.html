<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <!-- Bootstrap 4.4.1 CSS loaded from CDN, with Subresource Integrity (SRI) hash
         to ensure the file hasn't been tampered with -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons for the social login icons below (no SRI hash set here) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <title>Login</title>
  </head>

  <body class="min-vh-100" style="background-color: #eef2f7">
    <div class="container-fluid py-5 flex-grow-1" style="background: #eef2f7">
      <div class="row justify-content-center">
        <!-- Centered column, roughly 1/3 width on medium+ screens -->
        <div class="col-md-4" style="margin-top: 80px">
          <!-- Login form: submits username/password via POST to /login.
               NOTE: no CSRF token field present — if this is a Flask app,
               consider adding Flask-WTF/CSRF protection here. -->
          <form action="/login" method="POST">
            <div class="card">
              <div class="card-body">
                <!-- Jinja2: only rendered if the server passed an 'error' variable
                     (e.g. "Invalid username or password") -->
                {% if error %}
                <div class="alert alert-dark" role="alert">{{error}}</div>
                {% endif %}

                <div class="form-group">
                  <label for="username">Username</label>
                  <!-- Repopulates the username field after a failed login attempt,
                       using Flask's request.form (password is intentionally NOT
                       repopulated for security) -->
                  <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ request.form.get('username', '') }}"
                  />
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <!-- type="password" masks input; no autocomplete attribute set -->
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Password"
                  />
                </div>
                <button type="submit" class="btn btn-dark">Log in</button>

                <p class="mt-3">
                  New user?
                  <!-- Flask url_for() dynamically builds the URL for the 'register' route,
                       avoiding hardcoded paths -->
                  <a href="{{ url_for('register') }}">Register here</a>
                </p>
                <div class="text-center mt-3">
                  <!-- Social/external links — currently just point to each platform's
                       homepage, not actual OAuth login flows -->
                  <a href="https://google.com" class="text-dark mx-2"
                    ><i class="bi bi-google" style="font-size: 1.5rem"></i
                  ></a>
                  <a href="https://instagram.com" class="text-dark mx-2"
                    ><i class="bi bi-instagram" style="font-size: 1.5rem"></i
                  ></a>
                  <a href="https://facebook.com" class="text-dark mx-2"
                    ><i class="bi bi-facebook" style="font-size: 1.5rem"></i
                  ></a>
                  <a href="https://whatsapp.com" class="text-dark mx-2"
                    ><i class="bi bi-whatsapp" style="font-size: 1.5rem"></i
                  ></a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- jQuery (slim build, no AJAX/effects modules) required by Bootstrap 4's JS plugins -->
    <script
      src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
      integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
      crossorigin="anonymous"
    ></script>
    <!-- Popper.js: handles positioning for Bootstrap dropdowns/tooltips/popovers -->
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
      integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
      crossorigin="anonymous"
    ></script>
    <!-- Bootstrap 4 JS bundle (depends on jQuery + Popper loaded above) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
